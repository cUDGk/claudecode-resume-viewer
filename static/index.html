<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>cclog</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #d0d0d0;
    --text-dim: #888;
    --text-mute: #5a5a5a;
    --blue: #4a9eff;
    --orange: #ff8c42;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  input, button, textarea, select { border-radius: 0; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
    font-size: 13px;
    line-height: 1.45;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .brand { color: var(--text-dim); font-weight: bold; letter-spacing: 1px; }
  header input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 4px 8px;
    font: inherit;
    outline: none;
    border-radius: 0;
  }
  header input:focus { border-color: var(--blue); }
  header .status { color: var(--text-mute); font-size: 12px; min-width: 60px; text-align: right; }
  main { display: flex; flex: 1; overflow: hidden; }
  #side {
    width: 340px;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .proj {
    padding: 6px 10px 4px 10px;
    color: var(--text-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    user-select: none;
    cursor: pointer;
  }
  .proj.collapsed::before { content: "+ "; }
  .proj:not(.collapsed)::before { content: "- "; }
  .sess {
    padding: 6px 10px 6px 18px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    border-left: 2px solid transparent;
  }
  .sess:hover { background: var(--panel-2); }
  .sess.active {
    background: var(--panel-2);
    border-left-color: var(--blue);
  }
  .sess .title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .meta {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 2px;
    display: flex;
    gap: 8px;
  }
  #main { flex: 1; overflow-y: auto; padding: 0; }
  .msg {
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
  }
  .msg .role {
    font-size: 11px;
    color: var(--text-mute);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .msg.user .role { color: var(--blue); }
  .msg.assistant .role { color: var(--orange); }
  .msg.tool_use .role { color: var(--orange); }
  .msg.tool_result .role { color: var(--text-dim); }
  .msg.thinking .role { color: var(--text-mute); }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg.user .body { color: var(--text); }
  .msg.assistant .body { color: var(--text); }
  .msg.tool_use .body, .msg.tool_result .body, .msg.thinking .body {
    color: var(--text-dim);
    font-size: 12px;
  }
  details { margin-top: 4px; }
  details > summary {
    cursor: pointer;
    color: var(--text-mute);
    list-style: none;
    user-select: none;
    padding: 2px 0;
  }
  details > summary::before { content: "[+] "; color: var(--text-mute); }
  details[open] > summary::before { content: "[-] "; }
  details > summary:hover { color: var(--text-dim); }
  details pre {
    margin: 4px 0 0 0;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow-x: auto;
    color: var(--text-dim);
    font-size: 12px;
    max-height: 400px;
    overflow-y: auto;
  }
  pre, code { font-family: inherit; }
  .empty {
    color: var(--text-mute);
    padding: 24px;
    text-align: center;
  }
  .results { padding: 0; }
  .result {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .result:hover { background: var(--panel-2); }
  .result .head {
    color: var(--blue);
    font-size: 11px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .result .head .where { color: var(--text-mute); margin-left: 8px; text-transform: none; letter-spacing: 0; }
  .result .snip {
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    font-size: 12px;
  }
  mark {
    background: var(--orange);
    color: var(--bg);
    padding: 0 2px;
    border-radius: 0;
    font-weight: bold;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  .mode-tag {
    display: inline-block;
    padding: 0 6px;
    margin-right: 6px;
    font-size: 11px;
    border: 1px solid var(--border-strong);
    color: var(--text-mute);
  }
  .mode-tag.search { color: var(--orange); border-color: var(--orange); }
  .mode-tag.session { color: var(--blue); border-color: var(--blue); }
</style>
</head>
<body>
<header>
  <span class="brand">CCLOG</span>
  <input id="q" placeholder="search... (Enter / Esc to clear)" autocomplete="off">
  <span class="status" id="status"></span>
</header>
<main>
  <aside id="side"></aside>
  <section id="content"><div class="empty">SELECT A SESSION</div></section>
</main>
<script>
let sessions = [];
let currentId = null;
let lastQuery = "";
const collapsed = new Set();

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtSize(b) {
  if (b < 1024) return b + "B";
  if (b < 1024*1024) return (b/1024).toFixed(0) + "K";
  return (b/1024/1024).toFixed(1) + "M";
}
function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return esc(text).replace(new RegExp(re.source.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), "<<<HL>>>$&<<<\/HL>>>")
    .replace(/<<<HL>>>/g, "<mark>").replace(/<<<\/HL>>>/g, "</mark>");
}

async function load() {
  setStatus("loading...");
  try {
    sessions = await fetch("/api/sessions").then(r => r.json());
  } catch(e) {
    setStatus("ERR");
    return;
  }
  setStatus(sessions.length + " sessions");
  renderSide();
}
function setStatus(s) { document.getElementById("status").textContent = s; }

function renderSide() {
  const side = document.getElementById("side");
  const groups = {};
  for (const s of sessions) (groups[s.cwd || "(unknown)"] ??= []).push(s);
  const cwds = Object.keys(groups).sort((a,b) => {
    const ma = Math.max(...groups[a].map(x => x.modified));
    const mb = Math.max(...groups[b].map(x => x.modified));
    return mb - ma;
  });
  side.innerHTML = "";
  for (const cwd of cwds) {
    const list = groups[cwd].sort((a,b) => b.modified - a.modified);
    const isCollapsed = collapsed.has(cwd);
    const proj = document.createElement("div");
    proj.className = "proj" + (isCollapsed ? " collapsed" : "");
    proj.textContent = `${cwd} (${list.length})`;
    proj.onclick = () => {
      if (collapsed.has(cwd)) collapsed.delete(cwd); else collapsed.add(cwd);
      renderSide();
    };
    side.appendChild(proj);
    if (isCollapsed) continue;
    for (const s of list) {
      const el = document.createElement("div");
      el.className = "sess" + (s.id === currentId ? " active" : "");
      el.dataset.id = s.id;
      const title = s.title || s.first_msg || s.id;
      el.innerHTML = `
        <div class="title">${esc(title)}</div>
        <div class="meta">
          <span>${fmtDate(s.modified)}</span>
          <span>${s.msg_count || 0} msg</span>
          <span>${fmtSize(s.size || 0)}</span>
        </div>`;
      el.onclick = () => openSession(s.id);
      side.appendChild(el);
    }
  }
}

async function openSession(id, scrollLine) {
  currentId = id;
  document.querySelectorAll(".sess").forEach(e =>
    e.classList.toggle("active", e.dataset.id === id));
  setStatus("loading session...");
  const data = await fetch("/api/session/" + encodeURIComponent(id)).then(r => r.json());
  const main = document.getElementById("content");
  main.innerHTML = "";
  const tag = document.createElement("div");
  tag.style.padding = "6px 16px";
  tag.style.borderBottom = "1px solid var(--border)";
  tag.style.background = "var(--panel)";
  tag.innerHTML = `<span class="mode-tag session">SESSION</span><span style="color:var(--text-dim)">${esc(id)}</span>`;
  main.appendChild(tag);
  const wrap = document.createElement("div");
  main.appendChild(wrap);
  for (const m of data.messages) wrap.appendChild(renderMsg(m));
  setStatus(data.messages.length + " entries");
  if (scrollLine != null) {
    const t = wrap.querySelector(`[data-line="${scrollLine}"]`);
    if (t) t.scrollIntoView({behavior: "smooth", block: "center"});
  } else {
    main.scrollTop = 0;
  }
}

function renderMsg(m) {
  const el = document.createElement("div");
  el.className = "msg " + (m.kind || "unknown");
  el.dataset.line = m.line;
  let header = "";
  let body = "";
  if (m.kind === "user_text") {
    header = "USER";
    body = `<div class="body">${esc(m.text)}</div>`;
  } else if (m.kind === "assistant_text") {
    header = "ASSISTANT";
    body = `<div class="body">${esc(m.text)}</div>`;
  } else if (m.kind === "thinking") {
    header = "THINKING";
    const t = m.text || "";
    body = `<details><summary>${esc(t.slice(0,120))}${t.length>120?"...":""}</summary><pre>${esc(t)}</pre></details>`;
  } else if (m.kind === "tool_use") {
    header = "TOOL > " + (m.name || "?");
    body = `<details><summary>input</summary><pre>${esc(JSON.stringify(m.input, null, 2))}</pre></details>`;
  } else if (m.kind === "tool_result") {
    header = "RESULT";
    let text = m.content;
    if (typeof text !== "string") text = JSON.stringify(text, null, 2);
    if (text == null) text = "";
    const preview = text.slice(0, 120).replace(/\n/g, " ");
    body = `<details><summary>${esc(preview)}${text.length>120?"...":""}</summary><pre>${esc(text)}</pre></details>`;
  } else {
    header = "?";
    body = `<pre>${esc(JSON.stringify(m, null, 2))}</pre>`;
  }
  el.innerHTML = `<div class="role">${esc(header)}</div>${body}`;
  return el;
}

const qInput = document.getElementById("q");
let searchTimer = null;
qInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    runSearch(qInput.value.trim());
  } else if (e.key === "Escape") {
    qInput.value = "";
    lastQuery = "";
    if (currentId) openSession(currentId);
    else { document.getElementById("content").innerHTML = '<div class="empty">SELECT A SESSION</div>'; }
  }
});

async function runSearch(q) {
  if (!q) return;
  lastQuery = q;
  setStatus("searching...");
  const r = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
  setStatus(r.length + " hits");
  renderResults(q, r);
}

function renderResults(q, results) {
  const main = document.getElementById("content");
  main.innerHTML = "";
  const tag = document.createElement("div");
  tag.style.padding = "6px 16px";
  tag.style.borderBottom = "1px solid var(--border)";
  tag.style.background = "var(--panel)";
  tag.innerHTML = `<span class="mode-tag search">SEARCH</span><span style="color:var(--text-dim)">"${esc(q)}" - ${results.length} hits</span>`;
  main.appendChild(tag);
  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "NO RESULTS";
    main.appendChild(empty);
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "results";
  main.appendChild(wrap);
  for (const r of results) {
    const sess = sessions.find(s => s.id === r.session_id);
    const title = sess ? (sess.title || sess.first_msg || sess.id) : r.session_id;
    const cwd = sess ? sess.cwd : "";
    const where = `${cwd} - line ${r.line}`;
    const el = document.createElement("div");
    el.className = "result";
    el.innerHTML = `
      <div class="head">${esc(title)}<span class="where">${esc(where)}</span></div>
      <div class="snip">${highlight(r.snippet, q)}</div>`;
    el.onclick = () => openSession(r.session_id, r.line);
    wrap.appendChild(el);
  }
}

load();
</script>
</body>
</html>
