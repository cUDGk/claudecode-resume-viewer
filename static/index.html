<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<title>cclog</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #d8d8d8;
    --text-dim: #999;
    --text-mute: #666;
    --blue: #4a9eff;
    --orange: #ff8c42;
    --hi-bg: #ff8c42;
    --hi-fg: #0a0a0a;
  }
  [data-theme="light"] {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --panel-2: #ebebe8;
    --border: #d4d4d2;
    --border-strong: #a8a8a6;
    --text: #1a1a1a;
    --text-dim: #555;
    --text-mute: #888;
    --blue: #0064d0;
    --orange: #c2410c;
    --hi-bg: #fde68a;
    --hi-fg: #1a1a1a;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  input, button, textarea, select { border-radius: 0; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
    font-size: 15px;
    line-height: 1.55;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header .brand {
    color: var(--text-dim);
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 14px;
  }
  header input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 7px 12px;
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  header input:focus { border-color: var(--blue); }
  header .status {
    color: var(--text-mute);
    font-size: 13px;
    min-width: 90px;
    text-align: right;
  }
  main { display: flex; flex: 1; overflow: hidden; }
  #side {
    width: 380px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .side-filter {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .side-filter input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 6px 10px;
    font: inherit;
    font-size: 13px;
    outline: none;
  }
  .side-filter input:focus { border-color: var(--blue); }
  .side-list {
    overflow-y: auto;
    flex: 1;
  }
  .proj {
    padding: 10px 14px 7px 14px;
    color: var(--text-mute);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    user-select: none;
    cursor: pointer;
    word-break: break-all;
  }
  .proj.collapsed::before { content: "+ "; }
  .proj:not(.collapsed)::before { content: "- "; }
  .sess {
    padding: 10px 14px 10px 22px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent;
  }
  .sess:hover { background: var(--panel-2); }
  .sess.active {
    background: var(--panel-2);
    border-left-color: var(--blue);
  }
  .sess .title {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
  }
  .sess .meta {
    font-size: 12px;
    color: var(--text-mute);
    margin-top: 4px;
    display: flex;
    gap: 10px;
  }
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    min-width: 0;
  }
  .mode-bar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .bar-row .session-title {
    color: var(--text);
    font-size: 14px;
    font-weight: bold;
    word-break: break-word;
    flex: 1;
    min-width: 0;
  }
  .mode-bar .session-id {
    color: var(--text-dim);
    font-size: 13px;
    word-break: break-all;
    flex: 1;
    min-width: 0;
  }
  .mode-bar .session-id-small {
    color: var(--text-mute);
    font-size: 11px;
    word-break: break-all;
  }
  .kc {
    font-size: 11px;
    padding: 1px 8px;
    border: 1px solid var(--border-strong);
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .kc strong { color: var(--text); font-weight: bold; }
  .kc.kc-user { border-color: var(--blue); color: var(--blue); }
  .kc.kc-user strong { color: var(--blue); }
  .kc.kc-asst, .kc.kc-tool { border-color: var(--orange); color: var(--orange); }
  .kc.kc-asst strong, .kc.kc-tool strong { color: var(--orange); }
  .kc.kc-time {
    border-color: var(--text-mute);
    text-transform: none;
    letter-spacing: 0;
    color: var(--text-dim);
  }
  .msg {
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  .msg .role {
    font-size: 12px;
    color: var(--text-mute);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .msg .role .ts {
    margin-left: auto;
    color: var(--text-mute);
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0;
    white-space: nowrap;
  }
  .msg.user_text .role { color: var(--blue); }
  .msg.assistant_text .role { color: var(--orange); }
  .msg.tool_use .role { color: var(--orange); }
  .msg.tool_result .role { color: var(--text-dim); }
  .msg.thinking .role { color: var(--text-mute); }
  .msg .body {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
  }
  .msg.tool_use .body, .msg.tool_result .body, .msg.thinking .body {
    color: var(--text-dim);
    font-size: 14px;
  }
  details { margin-top: 6px; }
  details > summary {
    cursor: pointer;
    color: var(--text-mute);
    list-style: none;
    user-select: none;
    padding: 4px 0;
    font-size: 13px;
  }
  details > summary::before { content: "[+] "; color: var(--text-mute); }
  details[open] > summary::before { content: "[-] "; }
  details > summary:hover { color: var(--text-dim); }
  details pre {
    margin: 6px 0 0 0;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: auto;
    color: var(--text-dim);
    font-size: 13px;
    max-height: 480px;
  }
  pre, code { font-family: inherit; }
  .empty {
    color: var(--text-mute);
    padding: 32px;
    text-align: center;
    font-size: 14px;
  }
  /* Search results - grouped by session */
  .results { padding: 0; }
  .result-group {
    border-bottom: 1px solid var(--border);
  }
  .result-group-head {
    padding: 12px 20px;
    background: var(--panel-2);
    cursor: pointer;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
    user-select: none;
  }
  .result-group-head:hover { background: var(--border); }
  .result-group-head .fold {
    color: var(--text-mute);
    font-size: 14px;
    width: 14px;
    flex-shrink: 0;
  }
  .result-group.collapsed .result-group-head .fold::before { content: "+"; }
  .result-group:not(.collapsed) .result-group-head .fold::before { content: "-"; }
  .result-group.collapsed .result-hits { display: none; }
  .result-group-head .gtitle {
    color: var(--blue);
    font-size: 14px;
    font-weight: bold;
  }
  .result-group-head .gtitle:hover { text-decoration: underline; }
  .result-group-head .gcount {
    color: var(--orange);
    font-size: 12px;
    border: 1px solid var(--orange);
    padding: 1px 8px;
    text-transform: uppercase;
  }
  .result-group-head .gcwd {
    color: var(--text-mute);
    font-size: 12px;
  }
  .result-group-head .gopen {
    margin-left: auto;
    font-size: 11px;
    color: var(--blue);
    border: 1px solid var(--blue);
    padding: 2px 8px;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
  }
  .result-group-head .gopen:hover { background: var(--blue); color: var(--bg); }
  .results-bulk {
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 10px;
    position: sticky;
    top: 49px;
    z-index: 1;
  }
  .result-hit {
    padding: 8px 20px 8px 36px;
    border-top: 1px dashed var(--border);
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .result-hit:hover { background: var(--panel-2); }
  .result-hit .hkind {
    color: var(--orange);
    font-size: 11px;
    border: 1px solid var(--orange);
    padding: 0 6px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .result-hit .hline {
    color: var(--text-mute);
    font-size: 12px;
    flex-shrink: 0;
  }
  .result-hit .hsnip {
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
    min-width: 0;
  }
  mark {
    background: var(--hi-bg);
    color: var(--hi-fg);
    padding: 0 3px;
    font-weight: bold;
  }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
  .mode-tag {
    display: inline-block;
    padding: 2px 8px;
    font-size: 12px;
    border: 1px solid var(--border-strong);
    color: var(--text-mute);
    flex-shrink: 0;
  }
  .mode-tag.search { color: var(--orange); border-color: var(--orange); }
  .mode-tag.session { color: var(--blue); border-color: var(--blue); }
  .btn {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.back { border-color: var(--blue); color: var(--blue); }
  .btn.copy.copied { border-color: var(--orange); color: var(--orange); }
</style>
</head>
<body>
<header>
  <span class="brand">CCLOG</span>
  <input id="q" autocomplete="off">
  <button id="theme-toggle" class="btn"></button>
  <button id="lang-toggle" class="btn"></button>
  <span class="status" id="status"></span>
</header>
<main>
  <aside id="side">
    <div class="side-filter">
      <input id="side-q" autocomplete="off">
    </div>
    <div class="side-list" id="side-list"></div>
  </aside>
  <section id="content"></section>
</main>
<script src="cclog-data.js"></script>
<script>
const I18N = {
  ja: {
    placeholder: "検索... (Enter で実行 / Esc でクリア)",
    no_data: "データなし",
    sessions_count: n => `${n} セッション`,
    no_results: "結果なし",
    select_session: "左からセッションを選択",
    entries_count: n => `${n} 項目`,
    hits_count: n => `${n} 件`,
    sessions_in_results: (s, h) => `${s} セッション / ${h} 件`,
    searching: "検索中...",
    mode_session: "セッション",
    mode_search: "検索",
    role_user: "ユーザー",
    role_assistant: "アシスタント",
    role_thinking: "思考",
    role_tool: "ツール",
    role_result: "結果",
    role_unknown: "不明",
    label_input: "入力",
    msg_unit: "件",
    line_label: "行",
    back_to_search: "検索結果に戻る",
    copy_id: "ID コピー",
    copied: "コピー済",
    open: "開く",
    fold_all: "全て閉じる",
    unfold_all: "全て展開",
    toggle_lang: "EN",
    toggle_theme_to_light: "☀ ライト",
    toggle_theme_to_dark: "☾ ダーク",
    side_filter: "セッション絞り込み...",
    chip_user: "ユーザー",
    chip_asst: "アシスタント",
    chip_think: "思考",
    chip_tool: "ツール",
    chip_result: "結果",
    title_default: n => `cclog (${n} セッション)`,
    title_session: t => `cclog · ${t}`,
    title_search: (q, n) => `cclog · 検索: ${q} (${n})`,
    duration_hm: (h, m) => `${h}時間${m}分`,
    duration_m: m => `${m}分`,
    duration_s: s => `${s}秒`,
  },
  en: {
    placeholder: "search... (Enter to run / Esc to clear)",
    no_data: "NO DATA",
    sessions_count: n => `${n} sessions`,
    no_results: "NO RESULTS",
    select_session: "SELECT A SESSION",
    entries_count: n => `${n} entries`,
    hits_count: n => `${n} hits`,
    sessions_in_results: (s, h) => `${s} sessions / ${h} hits`,
    searching: "searching...",
    mode_session: "SESSION",
    mode_search: "SEARCH",
    role_user: "USER",
    role_assistant: "ASSISTANT",
    role_thinking: "THINKING",
    role_tool: "TOOL",
    role_result: "RESULT",
    role_unknown: "?",
    label_input: "input",
    msg_unit: "msg",
    line_label: "line",
    back_to_search: "Back to results",
    copy_id: "Copy ID",
    copied: "Copied",
    open: "Open",
    fold_all: "Fold all",
    unfold_all: "Unfold all",
    toggle_lang: "JA",
    toggle_theme_to_light: "☀ LIGHT",
    toggle_theme_to_dark: "☾ DARK",
    side_filter: "filter sessions...",
    chip_user: "USER",
    chip_asst: "ASST",
    chip_think: "THINK",
    chip_tool: "TOOL",
    chip_result: "RESULT",
    title_default: n => `cclog (${n} sessions)`,
    title_session: t => `cclog · ${t}`,
    title_search: (q, n) => `cclog · search: ${q} (${n})`,
    duration_hm: (h, m) => `${h}h ${m}m`,
    duration_m: m => `${m}m`,
    duration_s: s => `${s}s`,
  },
};

let lang = localStorage.getItem("cclog-lang") || "ja";
let theme = localStorage.getItem("cclog-theme") || "dark";
const t = (k, ...a) => {
  const v = I18N[lang][k];
  return typeof v === "function" ? v(...a) : v;
};

const DATA = window.CCLOG_DATA || { sessions: [], transcripts: {} };
const sessions = DATA.sessions || [];
const transcripts = DATA.transcripts || {};

let currentId = null;
let mode = "empty";          // "empty" | "session" | "search"
let lastQuery = "";
let lastResults = null;
let cameFromSearch = false;
const collapsed = new Set();
const groupCollapsed = new Set();
let renderToken = 0;          // increments to cancel in-flight chunked renders

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtSize(b) {
  if (b < 1024) return b + "B";
  if (b < 1024*1024) return (b/1024).toFixed(0) + "K";
  return (b/1024/1024).toFixed(1) + "M";
}
function tsToMs(s) {
  if (!s) return null;
  const ms = Date.parse(s);
  return isNaN(ms) ? null : ms;
}
function fmtTimeShort(s) {
  const ms = tsToMs(s);
  if (ms == null) return "";
  return fmtDate(ms);
}
function fmtClock(s) {
  const ms = tsToMs(s);
  if (ms == null) return "";
  const d = new Date(ms);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtDuration(ms) {
  if (ms == null || ms < 0) return "";
  const sec = Math.round(ms / 1000);
  if (sec < 60) return t("duration_s", sec);
  const min = Math.round(sec / 60);
  if (min < 60) return t("duration_m", min);
  const h = Math.floor(min / 60);
  const mm = min % 60;
  return t("duration_hm", h, mm);
}
function setTitle(text) {
  document.title = text;
}
function highlight(text, q) {
  if (!q) return esc(text);
  const escQ = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp(escQ, "gi");
  const parts = [];
  let last = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    parts.push(esc(text.slice(last, m.index)));
    parts.push(`<mark>${esc(m[0])}</mark>`);
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  parts.push(esc(text.slice(last)));
  return parts.join("");
}
function setStatus(s) { $("status").textContent = s; }

function applyTheme() {
  document.documentElement.setAttribute("data-theme", theme);
  $("theme-toggle").textContent = theme === "dark"
    ? t("toggle_theme_to_light")
    : t("toggle_theme_to_dark");
}

function applyLang() {
  $("q").placeholder = t("placeholder");
  $("side-q").placeholder = t("side_filter");
  $("lang-toggle").textContent = t("toggle_lang");
  applyTheme();
  if (sessions.length === 0) setStatus(t("no_data"));
  else setStatus(t("sessions_count", sessions.length));
  renderSide();
  if (mode === "empty") {
    $("content").innerHTML = `<div class="empty">${t("select_session")}</div>`;
    setTitle(t("title_default", sessions.length));
  } else if (mode === "session" && currentId) {
    renderSession(currentId);
  } else if (mode === "search") {
    renderResults(lastQuery, lastResults || []);
  }
}

let sideFilterQ = "";
function sessionMatchesFilter(s, q) {
  if (!q) return true;
  const ql = q.toLowerCase();
  return (
    (s.title || "").toLowerCase().includes(ql) ||
    (s.first_msg || "").toLowerCase().includes(ql) ||
    (s.cwd || "").toLowerCase().includes(ql) ||
    (s.id || "").toLowerCase().includes(ql)
  );
}

function renderSide() {
  const list = $("side-list");
  const filtered = sessions.filter(s => sessionMatchesFilter(s, sideFilterQ));
  const groups = {};
  for (const s of filtered) (groups[s.cwd || "(unknown)"] ??= []).push(s);
  const cwds = Object.keys(groups).sort((a,b) =>
    Math.max(...groups[b].map(x => x.modified || 0)) - Math.max(...groups[a].map(x => x.modified || 0)));
  list.innerHTML = "";
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">${esc(t("no_results"))}</div>`;
    return;
  }
  for (const cwd of cwds) {
    const sub = groups[cwd].sort((a,b) => (b.modified || 0) - (a.modified || 0));
    const isCollapsed = collapsed.has(cwd);
    const proj = document.createElement("div");
    proj.className = "proj" + (isCollapsed ? " collapsed" : "");
    proj.textContent = `${cwd} (${sub.length})`;
    proj.onclick = () => {
      if (collapsed.has(cwd)) collapsed.delete(cwd); else collapsed.add(cwd);
      renderSide();
    };
    list.appendChild(proj);
    if (isCollapsed) continue;
    for (const s of sub) {
      const el = document.createElement("div");
      el.className = "sess" + (s.id === currentId ? " active" : "");
      el.dataset.id = s.id;
      const title = s.title || s.first_msg || s.id;
      el.innerHTML = `
        <div class="title">${esc(title)}</div>
        <div class="meta">
          <span>${fmtDate(s.modified)}</span>
          <span>${s.msg_count || 0} ${t("msg_unit")}</span>
          <span>${fmtSize(s.size || 0)}</span>
        </div>`;
      el.onclick = () => openSession(s.id, null, false);
      list.appendChild(el);
    }
  }
}

function openSession(id, scrollLine, fromSearch) {
  currentId = id;
  mode = "session";
  cameFromSearch = !!fromSearch;
  document.querySelectorAll(".sess").forEach(e =>
    e.classList.toggle("active", e.dataset.id === id));
  updateHashForSession(id, scrollLine);
  renderSession(id, scrollLine);
}

function renderSession(id, scrollLine) {
  const messages = transcripts[id] || [];
  const sess = sessions.find(s => s.id === id);
  const title = sess ? (sess.title || sess.first_msg || id) : id;
  const main = $("content");
  main.innerHTML = "";
  setTitle(t("title_session", title));

  const bar = document.createElement("div");
  bar.className = "mode-bar";
  let backBtn = "";
  if (cameFromSearch && lastResults) {
    backBtn = `<button id="back-btn" class="btn back">← ${esc(t("back_to_search"))}</button>`;
  }
  // Time range / duration
  const firstMs = sess ? tsToMs(sess.first_ts) : null;
  const lastMs = sess ? tsToMs(sess.last_ts) : null;
  let timeStr = "";
  if (firstMs && lastMs) {
    const dur = fmtDuration(lastMs - firstMs);
    timeStr = `${fmtDate(firstMs)} → ${fmtDate(lastMs)}${dur ? " (" + dur + ")" : ""}`;
  } else if (firstMs) {
    timeStr = fmtDate(firstMs);
  }
  // Kind chips
  const c = (sess && sess.counts) || {};
  const chip = (cls, label, val) => val
    ? `<span class="kc ${cls}">${esc(label)} <strong>${val}</strong></span>` : "";
  const chips = [
    chip("kc-user", t("chip_user"), c.user_text || 0),
    chip("kc-asst", t("chip_asst"), c.assistant_text || 0),
    chip("kc-think", t("chip_think"), c.thinking || 0),
    chip("kc-tool", t("chip_tool"), c.tool_use || 0),
    chip("kc-tool", t("chip_result"), c.tool_result || 0),
  ].join("");
  bar.innerHTML = `
    <div class="bar-row">
      <span class="mode-tag session">${esc(t("mode_session"))}</span>
      <span class="session-title">${esc(title)}</span>
      <button id="copy-id" class="btn copy">${esc(t("copy_id"))}</button>
      ${backBtn}
    </div>
    <div class="bar-row">
      ${chips}
      ${timeStr ? `<span class="kc kc-time">${esc(timeStr)}</span>` : ""}
    </div>
    <div class="session-id-small">${esc(id)}</div>
  `;
  main.appendChild(bar);
  $("copy-id").onclick = () => copyToClipboard(id, $("copy-id"));
  if ($("back-btn")) {
    $("back-btn").onclick = () => {
      mode = "search";
      cameFromSearch = false;
      currentId = null;
      document.querySelectorAll(".sess").forEach(e => e.classList.remove("active"));
      renderResults(lastQuery, lastResults);
    };
  }
  setStatus(t("entries_count", messages.length));
  if (messages.length === 0) {
    main.scrollTop = 0;
    return;
  }
  const wrap = document.createElement("div");
  main.appendChild(wrap);

  // Cancel any in-flight chunked render and start a new one
  const myToken = ++renderToken;
  let i = 0;
  let scrolled = false;
  const CHUNK = 150;
  if (scrollLine == null) main.scrollTop = 0;

  const renderChunk = () => {
    if (myToken !== renderToken) return;     // superseded
    const end = Math.min(i + CHUNK, messages.length);
    const frag = document.createDocumentFragment();
    for (let j = i; j < end; j++) {
      frag.appendChild(renderMsg(messages[j], id, j));
    }
    wrap.appendChild(frag);
    i = end;
    if (scrollLine != null && !scrolled) {
      const target = wrap.querySelector(`[data-line="${scrollLine}"]`);
      if (target) {
        target.scrollIntoView({behavior: "auto", block: "center"});
        scrolled = true;
      }
    }
    if (i < messages.length) requestAnimationFrame(renderChunk);
  };
  renderChunk();
}

function copyToClipboard(text, btn) {
  const done = () => {
    if (!btn) return;
    btn.classList.add("copied");
    const old = btn.textContent;
    btn.textContent = t("copied");
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.textContent = old;
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); }
  catch(e) {} finally { document.body.removeChild(ta); }
}

// Render a message but defer the heavy <pre> content until the user opens
// the <details>. This avoids creating thousands of large text nodes on long
// sessions; the <pre> is built on toggle by the listener at #content.
function renderMsg(m, sessId, idx) {
  const el = document.createElement("div");
  el.className = "msg " + (m.kind || "unknown");
  el.dataset.line = m.line;
  const sidAttr = `data-sid="${esc(sessId)}" data-idx="${idx}"`;
  let header = "";
  let body = "";
  if (m.kind === "user_text") {
    header = t("role_user");
    body = `<div class="body">${esc(m.text)}</div>`;
  } else if (m.kind === "assistant_text") {
    header = t("role_assistant");
    body = `<div class="body">${esc(m.text)}</div>`;
  } else if (m.kind === "thinking") {
    header = t("role_thinking");
    const tx = m.text || "";
    body = `<details ${sidAttr} data-k="thinking"><summary>${esc(tx.slice(0,140))}${tx.length>140?"...":""}</summary></details>`;
  } else if (m.kind === "tool_use") {
    header = `${t("role_tool")} > ${m.name || "?"}`;
    body = `<details ${sidAttr} data-k="tool_use"><summary>${esc(t("label_input"))}</summary></details>`;
  } else if (m.kind === "tool_result") {
    header = t("role_result");
    let text = m.content;
    if (typeof text !== "string") text = JSON.stringify(text);
    if (text == null) text = "";
    const preview = text.slice(0, 140).replace(/\s+/g, " ");
    body = `<details ${sidAttr} data-k="tool_result"><summary>${esc(preview)}${text.length>140?"...":""}</summary></details>`;
  } else {
    header = t("role_unknown");
    body = `<pre>${esc(JSON.stringify(m, null, 2))}</pre>`;
  }
  const tsLabel = m.ts ? fmtClock(m.ts) : "";
  const tsEl = tsLabel
    ? `<span class="ts" title="${esc(fmtTimeShort(m.ts))}">${esc(tsLabel)}</span>` : "";
  el.innerHTML = `<div class="role"><span>${esc(header)}</span>${tsEl}</div>${body}`;
  return el;
}

// Lazy-populate <pre> when a <details> opens. <toggle> doesn't bubble, so we
// listen with capture=true on the scroll container.
document.getElementById("content").addEventListener("toggle", function(e) {
  const det = e.target;
  if (!det || det.tagName !== "DETAILS" || !det.open) return;
  if (det.querySelector("pre")) return;     // already populated
  const sid = det.dataset.sid;
  const idx = +det.dataset.idx;
  const k = det.dataset.k;
  if (!sid || isNaN(idx)) return;
  const m = (transcripts[sid] || [])[idx];
  if (!m) return;
  let text = "";
  if (k === "thinking") text = m.text || "";
  else if (k === "tool_use") text = JSON.stringify(m.input, null, 2);
  else if (k === "tool_result") {
    const c = m.content;
    text = c == null ? "" : (typeof c === "string" ? c : JSON.stringify(c, null, 2));
  }
  const pre = document.createElement("pre");
  pre.textContent = text;
  det.appendChild(pre);
}, true);

function msgSearchableText(m) {
  if (m.kind === "user_text" || m.kind === "assistant_text" || m.kind === "thinking") return m.text || "";
  if (m.kind === "tool_use") {
    const name = m.name || "";
    const input = m.input == null ? "" : (typeof m.input === "string" ? m.input : JSON.stringify(m.input));
    return name + " " + input;
  }
  if (m.kind === "tool_result") {
    const c = m.content;
    if (c == null) return "";
    return typeof c === "string" ? c : JSON.stringify(c);
  }
  return "";
}

function snippetAround(s, qLow, span) {
  const lt = s.toLowerCase();
  const idx = lt.indexOf(qLow);
  if (idx < 0) return s.slice(0, 200);
  const start = Math.max(0, idx - 60);
  const end = Math.min(s.length, idx + qLow.length + (span || 100));
  let out = s.slice(start, end);
  if (start > 0) out = "…" + out;
  if (end < s.length) out += "…";
  return out;
}

const SEARCH_LIMIT = 1000;

function clientSearch(q) {
  const qLow = q.toLowerCase();
  const out = [];
  const seen = new Set();
  for (const sess of sessions) {
    const msgs = transcripts[sess.id] || [];
    for (const m of msgs) {
      const text = msgSearchableText(m);
      if (!text) continue;
      const lt = text.toLowerCase();
      if (!lt.includes(qLow)) continue;
      const snip = snippetAround(text, qLow, 120);
      const key = sess.id + "|" + m.kind + "|" + m.line + "|" + snip.slice(0, 80);
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({
        session_id: sess.id,
        kind: m.kind,
        line: m.line,
        snippet: snip,
      });
      if (out.length >= SEARCH_LIMIT) return out;
    }
  }
  return out;
}

function renderResults(q, results) {
  const main = $("content");
  main.innerHTML = "";
  setTitle(t("title_search", q, (results || []).length));
  const bar = document.createElement("div");
  bar.className = "mode-bar";
  bar.innerHTML = `
    <div class="bar-row">
      <span class="mode-tag search">${esc(t("mode_search"))}</span>
      <span class="session-id">"${esc(q)}"</span>
    </div>
  `;
  main.appendChild(bar);
  if (!results || results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = t("no_results");
    main.appendChild(empty);
    setStatus(t("hits_count", 0));
    main.scrollTop = 0;
    return;
  }
  // Group by session, preserving insertion order (= original ranking)
  const grouped = new Map();
  for (const r of results) {
    if (!grouped.has(r.session_id)) grouped.set(r.session_id, []);
    grouped.get(r.session_id).push(r);
  }
  setStatus(t("sessions_in_results", grouped.size, results.length));

  // Bulk fold/unfold buttons
  const bulk = document.createElement("div");
  bulk.className = "results-bulk";
  bulk.innerHTML = `
    <button class="btn" id="fold-all">${esc(t("fold_all"))}</button>
    <button class="btn" id="unfold-all">${esc(t("unfold_all"))}</button>
  `;
  main.appendChild(bulk);

  const wrap = document.createElement("div");
  wrap.className = "results";
  main.appendChild(wrap);

  // If many sessions, default-collapse to keep the page snappy.
  // (Skip this auto-collapse on subsequent re-renders so user's manual
  //  toggles aren't undone — guard via groupCollapsed having any entry.)
  const autoCollapse = grouped.size > 8 && groupCollapsed.size === 0;

  for (const [sid, hits] of grouped.entries()) {
    if (autoCollapse) groupCollapsed.add(sid);
    const sess = sessions.find(s => s.id === sid);
    const title = sess ? (sess.title || sess.first_msg || sid) : sid;
    const cwd = sess ? sess.cwd : "";
    const isFolded = groupCollapsed.has(sid);
    const group = document.createElement("div");
    group.className = "result-group" + (isFolded ? " collapsed" : "");
    const head = document.createElement("div");
    head.className = "result-group-head";
    head.innerHTML = `
      <span class="fold"></span>
      <span class="gtitle">${esc(title)}</span>
      <span class="gcount">${hits.length} ${t("msg_unit")}</span>
      <span class="gcwd">${esc(cwd)}</span>
      <button class="gopen">${esc(t("open"))}</button>
    `;
    // Header click toggles fold; the title and the OPEN button do their own thing
    head.addEventListener("click", e => {
      if (e.target.classList.contains("gopen") || e.target.classList.contains("gtitle")) return;
      group.classList.toggle("collapsed");
      if (group.classList.contains("collapsed")) groupCollapsed.add(sid);
      else groupCollapsed.delete(sid);
    });
    head.querySelector(".gtitle").addEventListener("click", e => {
      e.stopPropagation();
      openSession(sid, hits[0].line, true);
    });
    head.querySelector(".gopen").addEventListener("click", e => {
      e.stopPropagation();
      openSession(sid, hits[0].line, true);
    });
    group.appendChild(head);
    const hitsWrap = document.createElement("div");
    hitsWrap.className = "result-hits";
    for (const h of hits) {
      const hit = document.createElement("div");
      hit.className = "result-hit";
      hit.innerHTML = `
        <span class="hkind">${esc(h.kind || "")}</span>
        <span class="hline">${t("line_label")} ${h.line}</span>
        <span class="hsnip">${highlight(h.snippet, q)}</span>
      `;
      hit.addEventListener("click", () => openSession(sid, h.line, true));
      hitsWrap.appendChild(hit);
    }
    group.appendChild(hitsWrap);
    wrap.appendChild(group);
  }

  $("fold-all").addEventListener("click", () => {
    for (const sid of grouped.keys()) groupCollapsed.add(sid);
    document.querySelectorAll(".result-group").forEach(g => g.classList.add("collapsed"));
  });
  $("unfold-all").addEventListener("click", () => {
    groupCollapsed.clear();
    document.querySelectorAll(".result-group").forEach(g => g.classList.remove("collapsed"));
  });

  requestAnimationFrame(() => { main.scrollTop = 0; });
}

const qInput = $("q");
qInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    runSearch(qInput.value.trim());
  } else if (e.key === "Escape") {
    qInput.value = "";
    lastQuery = "";
    lastResults = null;
    cameFromSearch = false;
    if (currentId) { mode = "session"; renderSession(currentId); }
    else { mode = "empty"; $("content").innerHTML = `<div class="empty">${t("select_session")}</div>`; }
  }
});

function runSearch(q) {
  if (!q) return;
  lastQuery = q;
  mode = "search";
  cameFromSearch = false;
  setStatus(t("searching"));
  requestAnimationFrame(() => {
    const r = clientSearch(q);
    lastResults = r;
    renderResults(q, r);
  });
}

$("lang-toggle").addEventListener("click", () => {
  lang = lang === "ja" ? "en" : "ja";
  localStorage.setItem("cclog-lang", lang);
  applyLang();
});

$("theme-toggle").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  localStorage.setItem("cclog-theme", theme);
  applyTheme();
});

// Sidebar filter input
$("side-q").addEventListener("input", e => {
  sideFilterQ = e.target.value;
  renderSide();
});

// URL hash management — #/<sessionId> or #/<sessionId>/<line>
let suppressHashUpdate = false;
function updateHashForSession(id, line) {
  if (!id) return;
  suppressHashUpdate = true;
  location.hash = line != null ? `/${id}/${line}` : `/${id}`;
}
function readHash() {
  const h = location.hash || "";
  if (!h.startsWith("#/")) return null;
  const parts = h.slice(2).split("/");
  return { id: parts[0] || null, line: parts[1] ? +parts[1] : null };
}
window.addEventListener("hashchange", () => {
  if (suppressHashUpdate) { suppressHashUpdate = false; return; }
  const h = readHash();
  if (h && h.id && transcripts[h.id]) openSession(h.id, h.line, false);
});


// Keyboard: "/" to focus the global search box
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    $("q").focus();
    $("q").select();
  }
});

try {
  applyLang();
  // restore from URL hash if any
  const h = readHash();
  if (h && h.id && transcripts[h.id]) {
    openSession(h.id, h.line, false);
  }
} catch (err) {
  $("status").textContent = "ERR";
  $("content").innerHTML = `<div class="empty" style="color:var(--orange);white-space:pre-wrap;text-align:left;padding:24px;">JavaScript error:\n\n${esc(err && err.stack || String(err))}</div>`;
  console.error(err);
}
window.addEventListener("error", e => {
  $("status").textContent = "ERR";
  if ($("content").children.length === 0) {
    $("content").innerHTML = `<div class="empty" style="color:var(--orange);white-space:pre-wrap;text-align:left;padding:24px;">Runtime error: ${esc(e.message)}\n${esc(e.filename || "")} :${e.lineno || "?"}</div>`;
  }
});
</script>
